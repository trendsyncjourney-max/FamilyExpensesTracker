<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Ledger</title>
<meta name="description" content="Shared family expense tracker with receipts, reimbursements, advances, calendar and personal ledgers. Works offline.">
<meta name="theme-color" content="#0d5e69">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Ledger">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <img src="./icons/icon-192.png" alt="" class="app-logo">
    <div class="header-titles">
      <h1>Family Ledger</h1>
      <span id="header-sub" class="header-sub">Shared expenses, receipts &amp; planning</span>
    </div>
  </div>
  <div class="header-right">
    <button id="install-btn" class="btn btn-ghost btn-sm hidden" type="button">⬇ Install</button>
    <div class="profile-switch" id="profile-switch" role="group" aria-label="Switch profile"></div>
  </div>
</header>

<main id="app" class="app-main">
  <!-- Pages get rendered here by app.js -->
</main>

<nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>

<!-- Floating capture button -->
<button id="fab" class="fab" type="button" aria-label="Capture receipt">
  <span class="fab-icon">＋</span><span class="fab-label">Receipt</span>
</button>

<!-- Generic modal -->
<div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-card" id="modal-card"></div>
</div>

<!-- Fullscreen image viewer -->
<div id="viewer-root" class="viewer-root hidden">
  <button class="viewer-close" id="viewer-close" type="button" aria-label="Close">✕</button>
  <img id="viewer-img" alt="Receipt full size">
</div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>

<input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
<input type="file" id="gallery-input" accept="image/*" class="hidden">

<script src="./js/app.js"></script>
</body>
</html>
